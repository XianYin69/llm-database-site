<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Database Explorer</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>🤖 LLM Database Explorer</h1>
        <p>Explore and compare Large Language Models</p>
    </header>
    
    <main>
        <section class="search-section">
            <input type="text" id="searchInput" placeholder="Search models...">
            <button id="searchBtn">Search</button>
        </section>
        
        <section class="models-grid" id="modelsGrid">
            <!-- Models will be loaded dynamically -->
        </section>
        
        <section class="stats" id="stats">
            <div class="stat-card">
                <h3>Total Models</h3>
                <p id="totalCount">0</p>
            </div>
            <div class="stat-card">
                <h3>Categories</h3>
                <p id="categoryCount">0</p>
            </div>
        </section>
    </main>
    
    <footer>
        <p>LLM Database Explorer &copy; 2026 | Built with GitHub Pages</p>
    </footer>
    
    <script src="app.js"></script>
</body>
</html>

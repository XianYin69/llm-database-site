<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LLM Pricing Database</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <div class="container">
            <h1>LLM <span>Pricing</span> Database</h1>
            <div class="header-stats">
                <div><strong id="totalCount">0</strong> models</div>
                <div><strong id="providerCount">0</strong> providers</div>
                <div><strong id="lastUpdated">-</strong></div>
            </div>
        </div>
    </header>
    
    <div class="controls">
        <div class="container">
            <div class="search-box">
                <input type="text" id="searchInput" placeholder="Search models or providers...">
            </div>
            <div class="filter-group" id="filterGroup">
                <button class="filter-btn active" data-filter="all">All</button>
            </div>
        </div>
    </div>
    
    <main class="container">
        <section class="models-grid" id="modelsGrid">
            <div class="no-results">Loading...</div>
        </section>
    </main>
    
    <footer>
        <div class="container">
            <p>LLM Pricing Database &copy; 2026 | Data updated automatically</p>
        </div>
    </footer>
    
    <script src="app.js"></script>
</body>
</html>
